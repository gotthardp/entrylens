# Entrylens application server configuration.
# All keys are optional; the values shown are the defaults.

# Address and port of the web interface and API.
#listen = "0.0.0.0:8080"

# SQLite database file.
#database = "/var/lib/entrylens/entrylens.db"

# Name of the site, shown in the web interface.
#title = "Entrylens"

# When the configuration page highlights a doorway's sensor.
[monitoring]
# Hours without a detected passage.
#no_passage_hours = 24
# Hours without a sensor report.
#no_report_hours = 6
# Lowest acceptable input voltage, in volts.
#min_voltage = 4.5
